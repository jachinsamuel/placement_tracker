# ==============================================================================
# Campus Placement Drive Candidate Tracking & Shortlisting Portal
# Application Configuration
# ==============================================================================

spring.application.name=placement-portal
server.port=8080

# ------------------------------------------------------------------------------
# Primary Database Configuration: MySQL
# Passwords and usernames are configurable via environment variables
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Do not run raw SQL scripts automatically; let Hibernate and DataInitializer manage entities
spring.sql.init.mode=never

# Static resource serving (Bootstrap, CSS, JS, HTML)
spring.web.resources.static-locations=classpath:/static/

# File upload limits for CSV importing (10MB max)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
