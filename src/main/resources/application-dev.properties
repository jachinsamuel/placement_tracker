# ==============================================================================
# Development / Standalone Demo Profile (H2 In-Memory with MySQL syntax)
# Use with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ==============================================================================

spring.datasource.url=jdbc:h2:mem:placement_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 console for easy inspection during viva/presentations
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
