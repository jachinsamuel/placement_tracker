# ==============================================================================
# Development / Standalone Demo Profile (H2 File-based Database)
# Data is persisted on disk in ./data/ so it is never lost on restarts
# ==============================================================================

spring.datasource.url=jdbc:h2:file:./data/placement_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 console for easy inspection during viva/presentations
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize DispatcherServlet on startup so runtime logs don't interrupt the terminal CLI
spring.mvc.servlet.load-on-startup=1
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
